syntax = "proto3";
package dps;

enum ResponseStatus{
  OK    = 0;
  ERROR = 1;
  EMPTY = 2;
}

message ResourceLockRequest{
  Long senderUUID   = 0;
  Long resourceUUID = 0;
  Long timestamp    = 0;
}

message ResourceResponse{

}

service MutualExclusionService {
  rpc lock(ResourceLockRequest) returns (ResponseStatus);
}
