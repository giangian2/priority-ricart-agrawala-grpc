syntax = "proto3";
package dps;

enum ResponseStatus{
  OK    = 0;
  ERROR = 1;
  EMPTY = 2;
}

message ResourceLockRequest{
  int32 senderUUID   = 0;
  int32 resourceUUID = 1;
  int64 timestamp    = 2;
}

message ResourceLockResponse{
  ResponseStatus status = 0;
  String message        = 1;
}

service MutualExclusionService {
  rpc lock(ResourceLockRequest) returns (stream ResourceLockResponse);
}
